name: jade-market

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  database:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 3g
    cpus: 1.5
    pids_limit: 256
    stop_grace_period: 60s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  app:
    image: jade-market:${APP_VERSION:?APP_VERSION must be set}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      JADE_WORLD_PERSIST: "1"
      JADE_WORLD_PERSIST_DRIVER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "3000"
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  backup:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./ops/backup-postgres.sh:/usr/local/bin/backup-postgres:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do /usr/local/bin/backup-postgres; sleep 86400; done"]
    depends_on:
      database:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
